[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kev-cognitive-runtime"
version = "0.51.0a3"
description = "KEV persistent, teachable, evidence-grounded cognitive runtime research"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["kev", "kev.*"]

[project.optional-dependencies]
semantic = ["torch>=2.0"]
