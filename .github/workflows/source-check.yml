name: source-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the research CPU tensor runtime
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install -c constraints-research.txt -e ".[dev,semantic-encoder]"
      - name: Compile public Python source
        run: python -m compileall -q kev scripts tests_public
      - name: Lint Python source
        run: python -m ruff check kev scripts tests_public
      - name: Type-check runtime source against Windows API declarations
        # The frozen source guards msvcrt with os.name, which mypy does not
        # narrow on Linux. Check its real Windows declarations without ignoring
        # errors; the test matrix separately exercises each host's lock backend.
        run: python -m mypy --platform win32 kev
      - name: Verify immutable public artifacts
        run: python -m kev.cli doctor
      - name: Replay the published aggregate rejection
        run: python -m kev.cli historical-replay
      - name: Run public test suite
        run: python -m pytest -q tests_public
